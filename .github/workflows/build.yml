name: Check and build desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev xvfb webkit2gtk-driver openbox x11-utils xdotool xcompmgr
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: npm ci
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Tag and package version must match')"
      - run: npm run format:check
      - run: npm run build
      - run: node --test tests/release-assets.test.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p qingnote-core --locked
      - run: cargo test -p qingnote --lib layout --locked
      - name: Browser UI checks
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui -- --reporter=list,github
      - name: Build installers
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Native Linux smoke test
        if: runner.os == 'Linux'
        env:
          QINGNOTE_BINARY: target/release/qingnote
          XCOMPMGR_PATH: /usr/bin/xcompmgr
        run: |
          cargo install tauri-driver --locked
          xvfb-run -a dbus-run-session -- node tests/native.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: haonote-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux'
        with:
          name: UI-test-evidence
          path: |
            artifacts/*.png
            test-results/

  release:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: haonote-*
          path: release-artifacts
          merge-multiple: true
      - name: Prepare release assets
        shell: bash
        run: |
          node scripts/release-assets.mjs
      - name: Publish public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --draft --prerelease \
            --title "haonote $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          # Publish only after all attachments have finished uploading.
          gh release edit "$GITHUB_REF_NAME" --draft=false
